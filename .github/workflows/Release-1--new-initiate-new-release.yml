name: "Release 1 - Initial New Release!"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version you want to release."
        required: true
        default: "1.0.0"

jobs:
  draft-new-release:
    name: "Draft a new release"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop branch 👮
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize mandatory git config 👶
        run: |
          set -e
          git config user.name "GitHub Actions"
          git config user.email noreply@github.com

      - name: Bump version in package.json & app.config.ts 🔨
        run: |
          set -euo pipefail

          echo "Bumping package.json to ${{ github.event.inputs.version }} ..."
          yarn version --new-version "${{ github.event.inputs.version }}" --no-git-tag-version

          echo "Patching app.config.ts ..."
          INPUT_VERSION="${{ github.event.inputs.version }}" node - <<'NODE'
          const fs = require('fs');

          const file = 'app.config.ts';
          if (!fs.existsSync(file)) {
            console.log('app.config.ts not found, skipping.');
            process.exit(0);
          }

          const inputVersion = process.env.INPUT_VERSION;
          if (!inputVersion) {
            throw new Error('INPUT_VERSION is not set');
          }

          let src = fs.readFileSync(file, 'utf8');

          // Replace a string-literal field: field: 'value' OR field: "value"
          function setStringField(source, field, newValue) {
            const single = new RegExp(`(${field}\\s*:\\s*')([^']*)(')`, 'm');
            const dbl    = new RegExp(`(${field}\\s*:\\s*")([^"]*)(")`, 'm');
            if (single.test(source)) return source.replace(single, (_m,p1,_old,p3)=>`${p1}${newValue.replace(/'/g,"\\'")}${p3}`);
            if (dbl.test(source))    return source.replace(dbl,    (_m,p1,_old,p3)=>`${p1}${newValue.replace(/"/g,'\\"')}${p3}`);
            return source;
          }

          // Increment a numeric field that is quoted (e.g. buildNumber: '61' or "61")
          function incQuotedNumberField(source, field) {
            const single = new RegExp(`(${field}\\s*:\\s*')(\\d+)(')`, 'm');
            const dbl    = new RegExp(`(${field}\\s*:\\s*")(\\d+)(")`, 'm');
            if (single.test(source)) return source.replace(single, (_m,p1,num,p3)=>`${p1}${Number(num)+1}${p3}`);
            if (dbl.test(source))    return source.replace(dbl,    (_m,p1,num,p3)=>`${p1}${Number(num)+1}${p3}`);
            return source;
          }

          // Increment a numeric field that is NOT quoted (e.g. versionCode: 530)
          function incNumberField(source, field) {
            const re = new RegExp(`(${field}\\s*:\\s*)(\\d+)`, 'm');
            if (re.test(source)) return source.replace(re, (_m,p1,num)=>`${p1}${Number(num)+1}`);
            return source;
          }

          let updated = setStringField(src, 'version', inputVersion);
          updated = incQuotedNumberField(updated, 'buildNumber'); // iOS
          updated = incNumberField(updated, 'versionCode');       // Android

          if (updated === src) {
            throw new Error('No changes were applied (fields not found?)');
          }

          fs.writeFileSync(file, updated);
          console.log(`Updated ${file} ✅`);
          NODE

      - name: Commit manifest files ✏️
        id: make-commit
        run: |
          set -e
          git add package.json app.config.ts
          git commit --message "Bump version to ${{ github.event.inputs.version }}" || echo "No changes to commit."

      - name: Push develop branch 🥶
        run: git push origin develop

      - name: Create and push release branch 🔥
        run: |
          set -e
          git checkout -b "release/${{ github.event.inputs.version }}" develop
          git push origin "release/${{ github.event.inputs.version }}"

      - name: Create pull request to master 🚀
        uses: thomaseizinger/create-pull-request@1.4.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          head: release/${{ github.event.inputs.version }}
          base: master
          title: Release version ${{ github.event.inputs.version }}
          reviewers: ${{ github.actor }}
          body: |
            Hi @${{ github.actor }}!

            This PR was created in response to a manual trigger of the release workflow here:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}.

            I've bumped the versions in the manifest files in this commit: ${{ steps.make-commit.outputs.commit }}.

            Merging this PR to master will trigger an action to release and publish the new version
            (check `Release-2-Publish-new-release.yml` for more information).

            Happy merging! GLHF! 🚀🙂️‍🔥
